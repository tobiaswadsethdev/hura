# XcodeGen project: `cd apps/ios && xcodegen`, then open Hura.xcodeproj.
# The .xcodeproj is generated and not checked in.

name: Hura
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Hura.xcconfig
  Release: Config/Hura.xcconfig

packages:
  HuraKit:
    path: HuraKit
  # The terminal emulator for terminal sessions and shells.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION are in
    # Config/Version.xcconfig, and not here: a setting here would override it.

targets:
  Hura:
    type: application
    platform: iOS
    sources:
      - Hura
    dependencies:
      - package: HuraKit
      - package: SwiftTerm
      - target: HuraNotificationService
      - target: HuraWidgets
    info:
      path: Hura/Info.plist
      properties:
        CFBundleDisplayName: hura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # The system background, as the first screen has: launching opens
        # straight onto the app's own black (or white) rather than a colour.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: hura uses the camera to scan a pairing code.
        NSFaceIDUsageDescription: hura locks with Face ID because it can approve what an agent runs on your servers.
        CFBundleURLTypes:
          # `hurad pair` prints a hura:// URL; opening one starts pairing.
          - CFBundleURLName: hura-pair
            CFBundleURLSchemes: [hura]
        ITSAppUsesNonExemptEncryption: false
        # hura cloud wakes the app quietly when the inbox was looked at on
        # another device, to clear what it showed (TrackersModel.syncSeen).
        UIBackgroundModes: [remote-notification]
        # A session's Live Activity, which the relay starts and updates
        # (docs/relay-api.md, "Live Activities"); HuraWidgets draws it.
        NSSupportsLiveActivities: true
        HuraRelayHost: $(HURA_RELAY_HOST)
        HuraKeychainGroup: $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
        HuraAppGroup: group.$(HURA_BUNDLE_ID)
    entitlements:
      path: Hura/Hura.entitlements
      properties:
        # Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
        # The app's own group comes first, so items without an explicit group
        # (server records with their tokens) stay out of the shared one.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HURA_BUNDLE_ID)
          - $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
        # Signing in to hura cloud with an Apple ID. Automatic signing turns
        # the capability on for the App ID; the service checks the identity
        # token against Apple's published keys.
        com.apple.developer.applesignin: [Default]
        # Where the app keeps a copy of the push keys for the Live Activity
        # widget, which has no Keychain on a phone (ActivityKeyFile).
        com.apple.security.application-groups:
          - group.$(HURA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HURA_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HURA_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  # Decrypts end-to-end encrypted notification text (docs/relay-api.md). It
  # can read the push keys in the shared Keychain group and nothing else.
  HuraNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - HuraNotificationService
    dependencies:
      - package: HuraKit
    info:
      path: HuraNotificationService/Info.plist
      properties:
        CFBundleDisplayName: hura Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HuraKeychainGroup: $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: HuraNotificationService/HuraNotificationService.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HURA_BUNDLE_ID).notificationservice
        DEVELOPMENT_TEAM: $(HURA_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  # Draws a session's Live Activity on the Lock Screen and in the Dynamic
  # Island, opening its sealed text with the push keys in the shared Keychain
  # group, as the notification service extension does. Allow and Deny are
  # LiveActivityIntents, compiled into the app too, where iOS runs them.
  HuraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HuraWidgets
      - Hura/LiveActivity/AnswerIntents.swift
      # The app's working mark, drawn still: a widget doesn't animate.
    dependencies:
      - package: HuraKit
    info:
      path: HuraWidgets/Info.plist
      properties:
        CFBundleDisplayName: hura
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HuraKeychainGroup: $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
        HuraAppGroup: group.$(HURA_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HuraWidgets/HuraWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HURA_BUNDLE_ID).shared
        com.apple.security.application-groups:
          - group.$(HURA_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HURA_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(HURA_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        # AnswerIntents.swift does nothing here: iOS runs it in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HURA_WIDGET

  HuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HuraTests
    dependencies:
      - target: Hura
      - package: HuraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HURA_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(HURA_TEAM_ID)
        GENERATE_INFOPLIST_FILE: true

schemes:
  Hura:
    build:
      targets:
        Hura: all
    test:
      targets:
        - HuraTests
