[package]
name = "hurad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The hura server: sessions and their sandboxes, over one authenticated TLS port"

[[bin]]
name = "hurad"
path = "src/main.rs"

[dependencies]
hura-core = { path = "../../crates/hura-core" }
hura-client = { path = "../../crates/hura-client" }
hura-proto = { path = "../../crates/hura-proto" }
sbx-client = { path = "../../crates/sbx-client" }
clap = { version = "4", features = ["derive"] }
# Raw mode for `attach`, and nothing else. It arrived through `ratatui` until
# the terminal interface went; this is the same crate, named directly.
crossterm = "0.29"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
# A shared preview's proxy into the sandbox (`share.rs`): a client connection
# per request, upgraded for a dev server's websocket. Already in the tree
# under axum; named for the client half.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
portable-pty = "0.9"
rand = "0.10"
sha2 = "0.11"
subtle = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23"
ring = "0.17"
qrcode = { version = "0.15.0", default-features = false }
# `hurad new --at 02:00`: a time of day is this machine's local time.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Windows: a Job Object that kills every forward when this process ends, which
# is what the `sh` guard does on Unix (see `forward.rs`).
[target.'cfg(windows)'.dependencies]
# And the console a scheduled task gives the server, hidden (see `console.rs`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
