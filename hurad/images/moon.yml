$schema: '../../.moon/cache/schemas/project.json'

# The sandbox image hurad builds. Its files are compiled into hura-core, which
# depends on this project so that a change here re-checks everything above it.
language: 'javascript'
layer: 'configuration'

tasks:
  # The chat host, which runs the Agent SDK inside a sandbox.
  test:
    command: 'node --test hura-base/hura-agent.test.mjs'
    inputs:
      - 'hura-base/**/*'

  # The same host on a Windows server, where a worktree session's chat runs
  # it on the server's own Node and its `!` commands go through Git Bash,
  # which the Windows runners carry where Git for Windows puts it.
  check-windows:
    command: 'node --test hura-base/hura-agent.test.mjs'
    env:
      HURA_BASH: 'C:\Program Files\Git\bin\bash.exe'
    inputs:
      - 'hura-base/**/*'
    options:
      os: 'windows'
