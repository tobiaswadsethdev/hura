[package]
name = "hura-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The client half of the hura protocol: paired servers, and one pinned TLS connection to each"

[dependencies]
hura-core = { path = "../hura-core" }
hura-proto = { path = "../hura-proto" }
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
