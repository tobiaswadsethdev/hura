# hura defaults. Everything here is optional, and everything here is a *default*:
# a flag on the command line always wins, and so does an explicit choice in the
# create form. Delete a key to go back to the built-in behaviour.
#
# Written by `hura config --init`. `hura config` shows what is in force.

# Gateway to talk to. Unset means the active one, as `openshell gateway list`
# reports it. `--gateway` overrides this.
# gateway = "default"

# Repository a `hura new` with no --repo clones. The TUI's picker opens on this
# one too, when it finds it -- a filter away from anything else, rather than a
# scroll.
# repo = "https://github.com/octocat/Hello-World"

# Branch to clone from. Unset means the remote's default branch, which is almost
# always what you want; set it for a repository that develops off something else.
# base = "develop"

# Policy applied to a new session: a template name, or a path to a YAML file.
# `hura policies` lists the templates.
# policy = "feature-work"

# Credential providers attached to a new session, by name; `openshell provider
# list` shows what exists. Providers are per organisation, not per forge, so a
# work repository and a personal one need one each.
#
# Setting this replaces the create form's guesswork with your answer: the form
# normally ticks the agent's credential and the repository host's when the type
# names exactly one, and this says so outright instead.
# providers = ["claude-oauth", "azure-pat"]

# Where the create form's picker looks for repositories, replacing the usual
# places (the working directory and its parent, ~/dev, ~/src, ~/code, ~/projects,
# ~/work, ~/repos, ~/git, and ~ itself one level deep) rather than adding to
# them. `HURA_REPO_ROOTS` still wins over this.
# repo_roots = ["~/dev", "~/work"]

# How often the TUI reads the sandboxes. One number, because the intervals
# underneath it are measured and related to each other: this scales all of them,
# so 2s polls half as often as the 1s default and 500ms twice as often. The cost
# is `git status` inside every live sandbox, so raise it on a large repository or
# a long list, and lower it if the diff pane feels behind the agent. 250ms to 60s.
# refresh = "1s"

# What a new session's agent is. "chat" runs Claude Code through the Agent SDK,
# inside the sandbox, and the window draws the conversation: messages, tool
# calls, permission prompts and questions as things to click. "terminal" is
# Claude Code's own terminal interface in tmux, which is what every session was
# before there was a choice. Either way it is the same `claude`, under the same
# policy. The create form can choose for one session.
# interface = "chat"

# Whether `hurad serve` may fetch a newer release in the background. It never
# replaces a running binary: it downloads and verifies ahead of time and leaves
# the result beside the current one, and the swap happens at the next process
# start. `false` turns the check off altogether, for a machine that would rather
# not reach github at all.
# auto_update = true

# MCP servers the agent gets, one table each. They run on the host -- in their
# own containers, holding their own credentials -- and the sandbox is granted one
# endpoint each, reachable only by the agent binary. Nothing else in the sandbox
# can talk to them, and no token ever lands on the sandbox filesystem.
#
# The url is what the *sandbox* sees, which is not what your browser sees:
# `localhost` in there is the sandbox itself and is refused outright. Use the
# container's name when it has joined the gateway's own docker network
# (`--network openshell-docker`, nothing published), or `host.openshell.internal`
# for a port published on the host. `transport` is "http" (the default) or "sse".
#
# Applies to sessions created after the change; existing ones keep what they were
# made with. See the MCP section of the README for the docker side.
# [[mcp]]
# name = "jira"
# url = "http://mcp-atlassian:9000/mcp"
#
# [[mcp]]
# name = "azure-devops"
# url = "http://mcp-azure-devops:9001/mcp"
# transport = "http"
#
# A table with an `image` instead of a `url` is *managed*: hurad starts the
# container, keeps it on the gateway's network, restarts it, and holds its
# secrets. Its url is derived -- http://hura-mcp-<name>:<port>/mcp -- which is
# why there is none to write, and why the two ways a hand-written one goes wrong
# cannot happen. `secrets` names environment variables whose values live in the
# server's own store, never here: `printf %s "$TOKEN" | hurad secret <NAME>`.
# The integrations screen in the window has the same buttons as `hurad mcp`.
# [[mcp]]
# name = "sentry"
# image = "ghcr.io/example/mcp-sentry:1.4"
# port = 9000
# args = ["--transport", "http"]
# env = { SENTRY_ORG = "contoso" }
# secrets = ["SENTRY_TOKEN"]

# What a work branch is named under: `<prefix>/<name>`. Defaults to `hura`, which
# is what every session's branch has been. Set it to your own name and a session
# started from a ticket is `tobias/PROJ-123-add-the-changelog`, which is the
# convention a tracker's commit hooks and your reviewers already look for.
# branch_prefix = "tobias"

# Skills copied into every new session, by name or by path. A name is one of
# your own, under ~/.claude/skills; anything with a `/` in it is a path, so a
# skill living in a repository can be pointed at where it is.
#
# A copy, taken while the sandbox is seeded -- a symlink cannot cross into a
# sandbox, and a bind mount would hand it the rest of your home directory. What
# this file holds is the pointer, so editing the original changes the next
# session; a running one keeps what it was created with.
#
# These are paths on the machine that runs the sessions. Skills on a *client*
# machine are pushed to the server's library instead -- from the window, and
# automatically before every create -- and a session gets both. See
# docs/skills.md.
# skills = ["ship-pr", "~/dev/notes/.claude/skills/changelog"]
