# hura defaults. Everything here is optional, and everything here is a *default*:
# a flag on the command line always wins, and so does an explicit choice in the
# create form. Delete a key to go back to the built-in behaviour.
#
# Written by `hura config --init`. `hura config` shows what is in force.

# The Docker Sandboxes CLI, when it is neither on PATH nor where its installer
# puts it (~/.docker/sbx/bin/sbx).
# sbx = "/opt/sbx/bin/sbx"

# Whole CPUs and memory for each session's sandbox. Unset, the runtime gives
# every sandbox every host CPU and half the host's memory, which is generous for
# one session and too much for several at once.
# sandbox_cpus = 4
# sandbox_memory = "8g"

# Repository a `hura new` with no --repo clones. The TUI's picker opens on this
# one too, when it finds it -- a filter away from anything else, rather than a
# scroll.
# repo = "https://github.com/octocat/Hello-World"

# Branch to clone from. Unset means the remote's default branch, which is almost
# always what you want; set it for a repository that develops off something else.
# base = "develop"

# Policy applied to a new session: a template name, or a path to a template file
# of your own (TOML, in the shape of policies/feature-work.toml).
# `hura policies` lists the templates.
# policy = "feature-work"

# Credentials a new session is given, by name from the [credentials.*] tables
# below. Credentials are per organisation, not per forge, so a work repository
# and a personal one need one each.
#
# Setting this replaces the create form's guesswork with your answer: the form
# normally ticks the agent's credential and the repository host's when the kind
# names exactly one, and this says so outright instead.
# providers = ["claude", "azure-devops"]

# The credentials a session may be given, one table each. `kind` is
# "claude-code-oauth" (a `claude setup-token` token), "azure-devops-pat",
# "github", "azure-cli" or "nuget-feed". The value comes from `command`, run on this machine in a shell, or
# from `ref`, a 1Password op:// reference or an AWS Secrets Manager ARN. hura
# never reads it: a session the credential is ticked for gets a secret of its
# own from the sandbox runtime, which runs the command itself and swaps the
# value into requests to the kind's hosts. Inside the sandbox there is only a
# placeholder. An Azure DevOps command prints the PAT itself; hura encodes it.
#
# Two kinds send to hosts you name, for what a repository reaches beyond its
# forge. "azure-cli" gives code in the sandbox Entra tokens minted by this
# machine's own `az` (it has to be signed in), one per resource and each sent
# only to the hosts listed for it; Azure.Identity's AzureCliCredential finds
# them through the image's stand-in `az`, so nothing logs in inside. "nuget-feed"
# is a private NuGet feed: `feed` is the source's key in the repository's
# NuGet.config, and the command prints its password (a PAT, or a token: Azure
# Artifacts takes `az`'s). `refresh` re-runs the source on a timer, which a
# token that expires needs; "azure-cli" refreshes every 30m unless told.
# [credentials.claude]
# kind = "claude-code-oauth"
# command = "tr -d '\r\n' < /home/me/.config/hura/tokens/claude"
#
# [credentials.azure-devops]
# kind = "azure-devops-pat"
# command = "tr -d '\r\n' < /home/me/.config/hura/tokens/azure-devops"
#
# [credentials.azure]
# kind = "azure-cli"
# [credentials.azure.resources]
# "https://vault.azure.net" = ["my-vault.vault.azure.net"]
# "https://storage.azure.com" = ["myaccount.blob.core.windows.net"]
#
# [credentials.feed]
# kind = "nuget-feed"
# feed = "MyPackages"
# hosts = ["pkgs.dev.azure.com"]
# command = "az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv"
# refresh = "30m"

# Where the create form's picker looks for repositories, replacing the usual
# places (the working directory and its parent, ~/dev, ~/src, ~/code, ~/projects,
# ~/work, ~/repos, ~/git, and ~ itself one level deep) rather than adding to
# them. `HURA_REPO_ROOTS` still wins over this.
# repo_roots = ["~/dev", "~/work"]

# Let a new session be a plain `git worktree` on this machine instead of a
# sandbox, for work the sandbox's Linux VM cannot do -- building an iOS app on a
# Mac, say. Off by default, and worth thinking about before turning on: such a
# session runs with this machine's own rights, files and credentials, with no
# policy on what it reaches. It is added to a project's checkout, so it needs a
# project. The working copies go under worktree_root, one directory each.
# worktrees = true
# worktree_root = "~/.local/share/hura/worktrees"

# How often the TUI reads the sandboxes. One number, because the intervals
# underneath it are measured and related to each other: this scales all of them,
# so 2s polls half as often as the 1s default and 500ms twice as often. The cost
# is `git status` inside every live sandbox, so raise it on a large repository or
# a long list, and lower it if the diff pane feels behind the agent. 250ms to 60s.
# refresh = "1s"

# What a new session's agent is. "chat" runs Claude Code through the Agent SDK,
# inside the sandbox, and the window draws the conversation: messages, tool
# calls, permission prompts and questions as things to click. "terminal" is
# Claude Code's own terminal interface in tmux, which is what every session was
# before there was a choice. Either way it is the same `claude`, under the same
# policy. The create form can choose for one session.
# interface = "chat"

# Whether `hurad serve` may fetch a newer release in the background. It never
# replaces a running binary: it downloads and verifies ahead of time and leaves
# the result beside the current one, and the swap happens at the next process
# start. `false` turns the check off altogether, for a machine that would rather
# not reach github at all.
# auto_update = true

# Where a sandbox image is pulled from when this machine does not have it yet.
# The images are built every night from hura's main branch and published here,
# so the first session wanting one downloads it instead of building it, and
# `hurad image pull` fetches the newest. A pull that fails falls back to
# building it here. Empty builds every image on this machine and never pulls.
# image_registry = "ghcr.io/tobiaswadsethdev/hura-sandbox"

# MCP servers the agent gets, one table each. They run on the host, in their own
# containers holding their own credentials, and the session is granted one
# endpoint each. No token ever lands on the sandbox filesystem.
#
# The url is what the *sandbox* sees, which is not what your browser sees:
# `localhost` in there is the sandbox itself and is refused outright. A server
# on this machine is published on 127.0.0.1 and named as `host.docker.internal`,
# which the sandbox runtime takes to this machine's loopback; a sandbox cannot
# reach a container by its name. `transport` is "http" (the default) or "sse".
#
# Applies to sessions created after the change; existing ones keep what they were
# made with. See the MCP section of the README for the docker side.
# [[mcp]]
# name = "jira"
# url = "http://host.docker.internal:9000/mcp"
#
# [[mcp]]
# name = "azure-devops"
# url = "http://host.docker.internal:9001/mcp"
# transport = "http"
#
# A table with an `image` instead of a `url` is *managed*: hurad starts the
# container, publishes it on 127.0.0.1 at its port, restarts it, and holds its
# secrets. Its url is derived, http://host.docker.internal:<port>/mcp, which is
# why there is none to write, and why the two ways a hand-written one goes wrong
# cannot happen. Each managed server needs a port of its own. `secrets` names environment variables whose values live in the
# server's own store, never here: `printf %s "$TOKEN" | hurad secret <NAME>`.
# The integrations screen in the window has the same buttons as `hurad mcp`.
# [[mcp]]
# name = "sentry"
# image = "ghcr.io/example/mcp-sentry:1.4"
# port = 9000
# args = ["--transport", "http"]
# env = { SENTRY_ORG = "contoso" }
# secrets = ["SENTRY_TOKEN"]

# What a work branch is named under: `<prefix>/<name>`. Defaults to `hura`, which
# is what every session's branch has been. Set it to your own name and a session
# started from a ticket is `tobias/PROJ-123-add-the-changelog`, which is the
# convention a tracker's commit hooks and your reviewers already look for.
# branch_prefix = "tobias"

# Skills copied into every new session, by name or by path. A name is one of
# your own, under ~/.claude/skills; anything with a `/` in it is a path, so a
# skill living in a repository can be pointed at where it is.
#
# A copy, taken while the sandbox is seeded -- a symlink cannot cross into a
# sandbox, and a bind mount would hand it the rest of your home directory. What
# this file holds is the pointer, so editing the original changes the next
# session; a running one keeps what it was created with.
#
# These are paths on the machine that runs the sessions. Skills on a *client*
# machine are pushed to the server's library instead -- from the window, and
# automatically before every create -- and a session gets both. See
# docs/skills.md.
# skills = ["ship-pr", "~/dev/notes/.claude/skills/changelog"]
