[package]
name = "hura-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The headless half of hura: sessions, policy, and everything that is not a renderer"

[dependencies]
sbx-client = { path = "../sbx-client" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The checksum `hurad update` verifies a download against, computed here rather
# than by `sha256sum`, which Windows does not have.
sha2 = "0.11"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
ts-rs = { version = "12", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
# TypeScript for the desktop application, generated from these very types so
# there is never a second hand-maintained copy of them. Off by default: it is a
# build-time concern of one consumer, and no shipped binary needs it.
ts = ["dep:ts-rs"]
# `tracker::ureq`: a transport for tracker requests that is not `curl`, for the
# iOS app and hura cloud.
ureq = ["dep:ureq"]
