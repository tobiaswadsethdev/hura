[package]
name = "hura-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "hura cloud: accounts, and the trackers they keep, behind one HTTPS API"
publish = false

[[bin]]
name = "hura-cloud"
path = "src/main.rs"

[dependencies]
hura-core = { path = "../hura-core", features = ["ureq"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
# Without TLS: Postgres is reached over Coolify's own network, beside it.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
uuid = { version = "1", features = ["serde"] }
rand = "0.10"
sha2 = "0.11"
subtle = "2"
ring = "0.17"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
