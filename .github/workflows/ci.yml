name: CI

# Every check in the repository is a moon task (docs/moon.md), and each job here
# is one operating system running the ones a change can affect: `moon ci`
# compares what changed against MOON_BASE and runs the tasks whose inputs it
# touches. A change to the site runs nothing; one to hura-core runs every crate
# above it, the desktop app's checks, and the Windows job.
#
# Tasks name the OS they need (`options.os`), and on any other OS moon runs
# them as no-ops, so the Linux job can ask for everything. The Windows and
# macOS runners are slower and dearer, so `plan` asks moon first whether any of
# their tasks are affected, and they are skipped -- which counts as passing for
# a required check -- when none are.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # What changed: a pull request against its base, a push against what `main`
  # was before it. A dispatch compares against git's empty tree, which makes
  # every file changed and runs everything -- the way to check the whole
  # repository on demand.
  MOON_BASE: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
        || github.event_name == 'push' && github.event.before
        || '4b825dc642cb6eb9a060e54bf8d69288fbee4904' }}
  MOON_HEAD: ${{ github.sha }}

jobs:
  plan:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.affected.outputs.windows }}
      macos: ${{ steps.affected.outputs.macos }}
    steps:
      # The whole history, because affected detection diffs two commits and a
      # shallow clone has only one of them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # moon, at the version in .prototools.
      - uses: moonrepo/setup-toolchain@v0

      - name: Ask moon
        id: affected
        run: |
          set -eu
          moon query tasks --affected > affected.json
          jq -r '.tasks | to_entries[] | "\(.key): \(.value | keys | join(", "))"' affected.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "windows=$(jq '[.tasks[][] | select(.id == "check-windows")] | length > 0' affected.json)" >> "$GITHUB_OUTPUT"
          echo "macos=$(jq '.tasks.hurakit.test != null or .tasks.ios.test != null' affected.json)" >> "$GITHUB_OUTPUT"

  # Everything that runs on Linux: the cargo workspace's fmt, clippy and tests,
  # hurad's release build, hura cloud against a real Postgres and its image, the
  # relay, the sandbox image's chat host, and the desktop app's TypeScript,
  # generated bindings and Tauri versions.
  linux:
    name: linux
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: hura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # hura cloud's tests skip themselves without it; here they run.
      HURA_CLOUD_TEST_DATABASE_URL: postgres://postgres:hura@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            services/relay/package-lock.json

      - uses: moonrepo/setup-toolchain@v0

      - run: moon ci

  # The client half has to compile for Windows, because the desktop app runs
  # there and hura-core is underneath it -- one `use std::os::unix::fs` costs
  # seconds to catch here and a tagged release anywhere else. And the desktop
  # crate itself, because `tauri-build` there needs things nothing on Linux
  # asks for: `icons/icon.ico` was missing for two increments and only this
  # could notice.
  windows:
    name: windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - uses: moonrepo/setup-toolchain@v0

      - run: moon ci :check-windows

  # The iPhone app: HuraKit's tests, including the push encryption against
  # hurad's own vector, and the app built and tested on a simulator.
  macos:
    name: macos
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen

      - uses: moonrepo/setup-toolchain@v0

      - run: moon ci hurakit:test ios:test
