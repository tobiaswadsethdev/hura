name: Release the desktop app

# Tag `desktop-vX.Y.Z` and this publishes the desktop app: Windows installers
# and a Mac disk image, and the manifest the installed Windows app updates
# itself from.
#
# The tag is normally made by `tag.yml` with `component: desktop`, which bumps
# the version in the desktop app's own five files. The app's version is its own:
# what it has to agree with a server about is the protocol
# (`hura_proto::VERSION`), which it checks when it connects, and not the
# release number. A protocol change therefore means a release of both.
#
# These releases are never marked "latest" on GitHub; hurad's are. The
# installed app finds its updates at gethura.app/desktop/latest.json, which the
# publish job below commits to `site/` after the release is up.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. desktop-v0.55.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # One resolved tag for both triggers. `github.ref_name` is the tag on a tag
  # push and the *branch* on a workflow_dispatch, which would name every asset
  # after `main` and produce a release nothing can find.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The desktop application for Windows, which is the one platform where there
  # is nothing else to install: `hurad` needs the sandbox runtime, a Docker
  # daemon and tmux, so the Windows side is the window and nothing but the window. It
  # pairs with a server from its own connect dialog rather than from a CLI --
  # see docs/desktop.md -- which is what makes an installer on its own useful.
  #
  # Linux is deliberately not built here. A Tauri bundle links against the
  # webkit2gtk of the distribution that built it, so one .deb or AppImage would
  # be a promise about GTK versions this cannot keep; there, it is built from the
  # tree. See docs/install.md.
  windows:
    name: windows
    runs-on: windows-latest
    # Whether there is a certificate to sign with, decided once here because
    # the `secrets` context is not in scope for a step's `if` -- see the import
    # step below. Job-level `env` is, and it may read `secrets`.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      # And whether there is an *updater* key, which is a different key for a
      # different job: the certificate above is what stops SmartScreen warning
      # about the installer, this is what the installed window checks before it
      # will replace itself. Same reasoning for making it conditional -- and one
      # extra reason, which is that `createUpdaterArtifacts` makes `tauri build`
      # *fail* without a key rather than skip the signing. A fork would not be
      # able to cut a release at all.
      #
      # Both halves, because the key is password-protected and half a pair is a
      # state you can reach by running one `gh secret set` and being
      # interrupted. Checking only the key would take that half-configured
      # repository and turn it into a build that fails while trying to sign,
      # rather than a build that quietly skips signing.
      HAS_UPDATER_KEY: >-
        ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != ''
            && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
    steps:
      # The tag, explicitly, and not whatever ref the run was started from. On
      # a tag push those are the same thing; on a `workflow_dispatch` they are
      # not -- the dispatch carries a branch, so this used to build `main` and
      # label the result with a tag it had never been at. Naming the tag also
      # means a dispatch for a tag that does not exist fails here, loudly,
      # instead of publishing whatever `main` happened to be.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag looks like a version
        shell: bash
        run: |
          case "$TAG" in
            desktop-v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a desktop-vX.Y.Z tag"; exit 1 ;;
          esac
          echo "VERSION=${TAG#desktop-v}" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop-windows

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The version in the bundle is the one Windows shows in Add or Remove
      # Programs and the one an upgrade compares against, so it has to be the
      # tag rather than whatever the file said when it was last edited.
      - name: Take the version from the tag
        shell: bash
        run: |
          set -eu
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          jq -r .version "$conf"

      # Signing, when there is a certificate to sign with.
      #
      # An unsigned installer is not broken -- the checksums below are the
      # integrity story and they are the one that does not expire -- but
      # SmartScreen puts a full-width warning in front of it, and "more info ->
      # run anyway" is a bad first impression for a tool whose whole pitch is
      # isolation.
      #
      # Conditional on the secret rather than required, so a fork and a
      # maintainer without a certificate can both still cut a release. The
      # thumbprint is read back from the imported certificate rather than
      # configured, because a thumbprint in a config file and a certificate in a
      # secret are two things to keep in step and only one of them is visible.
      #
      # Never verified against a real certificate at the time of writing: there
      # was none to test with. What is verified is the unsigned path, which is
      # every release so far.
      #
      # The condition reads the job-level `env` above and not `secrets`
      # directly: `secrets` is not an available context for a step's `if`, and
      # naming it there is not a false condition but an invalid workflow --
      # every job in the file, tarballs included, refuses to start. A step's
      # *own* `env` is no good either, since that is not in scope for its `if`.
      - name: Import the signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        id: cert
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = [System.IO.Path]::GetTempFileName() + '.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          $password = ConvertTo-SecureString -String $env:SIGNING_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($imported.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          # Read by `tauri build` itself to sign the updater manifest. Empty
          # when there is no key, which is what the override below is for.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          npm --prefix apps/desktop ci

          # Built up as one `--config` object because `tauri build` takes one.
          # `jq -n` rather than string concatenation: this ends up as JSON on a
          # command line inside a shell inside YAML, and hand-quoting it is how
          # the last three bugs in this file happened.
          overrides='{}'
          if [ -n "${THUMBPRINT:-}" ]; then
            # A timestamp is what keeps a signature valid after the certificate
            # expires; without one the installer stops verifying the day the
            # certificate does.
            overrides=$(jq -n --arg t "$THUMBPRINT" \
              '{bundle:{windows:{certificateThumbprint:$t,digestAlgorithm:"sha256",timestampUrl:"http://timestamp.digicert.com"}}}')
          else
            echo "no signing certificate; building unsigned"
          fi
          if [ "${HAS_UPDATER_KEY}" != "true" ]; then
            # No key, so no signed manifest -- and `createUpdaterArtifacts` is
            # turned back off rather than left to fail the build. The installer
            # still works; it just will not offer to update itself.
            echo "no updater key; building without updater artifacts"
            overrides=$(printf '%s' "$overrides" | jq '.bundle.createUpdaterArtifacts = false')
          fi
          echo "$overrides"
          npm --prefix apps/desktop run tauri -- build --config "$overrides"

      # Renamed to carry the tag and the target, like the tarballs, and
      # checksummed into the same SHA256SUMS -- an installer downloaded from a
      # release page deserves the same verification as a binary.
      - name: Package
        shell: bash
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist
          for msi in "$bundle"/msi/*.msi; do
            cp "$msi" "dist/hura-desktop-v${VERSION}-x86_64-pc-windows-msvc.msi"
          done
          for exe in "$bundle"/nsis/*-setup.exe; do
            cp "$exe" "dist/hura-desktop-v${VERSION}-x86_64-pc-windows-msvc-setup.exe"
          done
          cd dist
          sha256sum *.msi *.exe > desktop-windows.sha256
          cat desktop-windows.sha256

      # The manifest the installed window reads to find out it is behind.
      #
      # `latest.json` and not a name with the tag in it: the publish job below
      # copies it to `site/desktop/latest.json`, which is the fixed URL the
      # updater reads (gethura.app/desktop/latest.json), and onto the newest
      # `hurad` release, which is where windows installed before the split
      # still look. It is the one asset here whose name is deliberately not
      # versioned.
      #
      # The signature covers the installer's *bytes*, so renaming the file
      # below does not invalidate it. The `url` therefore points at the renamed
      # asset, which is where it actually ends up.
      - name: Write the update manifest
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          # Discovered rather than spelled out: the bundle carries the version
          # in its filename, and a pattern that has to be kept in step with
          # `tauri.conf.json` is a pattern that will not be.
          sig=$(ls "$bundle"/nsis/*-setup.exe.sig)
          asset="hura-desktop-v${VERSION}-x86_64-pc-windows-msvc-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$sig")" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/${asset}" \
            '{version: $version,
              pub_date: $pub_date,
              platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > dist/latest.json
          # Without the signature, which is long and is not the interesting
          # part of a log line.
          jq 'del(.platforms."windows-x86_64".signature)' dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: hura-desktop-windows
          path: |
            dist/hura-desktop-v${{ env.VERSION }}-x86_64-pc-windows-msvc.msi
            dist/hura-desktop-v${{ env.VERSION }}-x86_64-pc-windows-msvc-setup.exe
            dist/desktop-windows.sha256
            dist/latest.json
          # `warn` and not `error`, because `latest.json` is written only when
          # there is an updater key and the other three are not conditional on
          # anything. A missing manifest is a release without self-update, not
          # a broken release.
          if-no-files-found: warn

  # The desktop application for a Mac, as a disk image: Apple silicon, the one
  # Mac architecture `hurad` is released for too.
  #
  # Signed with a Developer ID and notarised when the secrets for both are
  # there, so it opens like any downloaded app. Without them it is still
  # built, ad-hoc signed -- an Apple silicon binary has to be signed somehow
  # to run at all -- and macOS asks once, under Privacy & Security, before it
  # will open it. Conditional for the same reasons as the Windows certificate:
  # a fork or a maintainer without an Apple Developer account can still cut a
  # release.
  #
  # The secrets:
  #   APPLE_CERTIFICATE           a "Developer ID Application" certificate and
  #                               its key, exported as .p12, base64
  #   APPLE_CERTIFICATE_PASSWORD  the .p12's password
  #   APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY
  #                               an App Store Connect API key (its id, the
  #                               issuer, and the .p8's contents), which is
  #                               what notarisation is asked with
  #
  # No self-update yet: the updater plugin is compiled in on Windows only, so
  # there are no updater artifacts to make here and none are asked for.
  macos:
    name: macos
    runs-on: macos-latest
    env:
      HAS_SIGNING_CERT: >-
        ${{ secrets.APPLE_CERTIFICATE != ''
            && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY_KEY: >-
        ${{ secrets.APPLE_API_KEY_ID != ''
            && secrets.APPLE_API_ISSUER != ''
            && secrets.APPLE_API_KEY != '' }}
    steps:
      # The tag, explicitly: see the Windows job.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag looks like a version
        run: |
          case "$TAG" in
            desktop-v[0-9]*.[0-9]*.[0-9]*) echo "building $TAG" ;;
            *) echo "TAG=$TAG is not a desktop-vX.Y.Z tag"; exit 1 ;;
          esac
          echo "VERSION=${TAG#desktop-v}" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop-macos

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The version in the bundle is the one Finder shows, so it is the tag's.
      - name: Take the version from the tag
        run: |
          set -eu
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' "$conf" > "$conf.new"
          mv "$conf.new" "$conf"
          jq -r .version "$conf"

      # Into a keychain of the job's own, and the identity read back out of it
      # rather than configured: the name in a secret and the certificate in
      # another are two things to keep in step, and only one is visible.
      #
      # Never verified against a real certificate at the time of writing --
      # there was none to test with. The unsigned path is the one verified.
      - name: Import the signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        id: cert
        env:
          SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the certificate"; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          npm --prefix apps/desktop ci

          # One `--config` object built with `jq`, as on Windows.
          overrides='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ -n "${IDENTITY:-}" ]; then
            overrides=$(printf '%s' "$overrides" | jq --arg i "$IDENTITY" '.bundle.macOS.signingIdentity = $i')
            # Tauri notarises after signing when these are in its
            # environment, and staples the ticket to the app.
            if [ "$HAS_NOTARY_KEY" = "true" ]; then
              key="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$NOTARY_KEY" > "$key"
              export APPLE_API_KEY="$NOTARY_KEY_ID" APPLE_API_ISSUER="$NOTARY_ISSUER" APPLE_API_KEY_PATH="$key"
            else
              echo "signed, but no notarisation key: Gatekeeper will still ask"
            fi
          else
            echo "no signing certificate; building ad-hoc signed"
            overrides=$(printf '%s' "$overrides" | jq '.bundle.macOS.signingIdentity = "-"')
          fi
          echo "$overrides"
          npm --prefix apps/desktop run tauri -- build --bundles app,dmg --config "$overrides"

      # Renamed and checksummed as the rest are.
      - name: Package
        run: |
          set -eu
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir -p dist
          for dmg in "$bundle"/dmg/*.dmg; do
            cp "$dmg" "dist/hura-desktop-v${VERSION}-aarch64-apple-darwin.dmg"
          done
          cd dist
          shasum -a 256 *.dmg > desktop-macos.sha256
          cat desktop-macos.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: hura-desktop-macos
          path: |
            dist/hura-desktop-v${{ env.VERSION }}-aarch64-apple-darwin.dmg
            dist/desktop-macos.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Read the version
        run: echo "VERSION=${TAG#desktop-v}" >> "$GITHUB_ENV"

      # The release notes cover what changed since this component's previous
      # release, not since whatever was tagged last: with three components
      # releasing from one repository that is as likely as not someone else's.
      # Before the first `desktop-v` release that is the last combined one, `v...`.
      - name: Find the previous release
        id: prev
        run: |
          set -eu
          git fetch --force --tags --quiet origin
          # Every candidate and this tag, in version order; the one before
          # this tag is the previous release.
          prev=$( { git tag --list 'desktop-v[0-9]*' 'v[0-9]*'; echo "$TAG"; } \
            | sort -u \
            | awk '{ v = $0; sub(/^[a-z-]*v/, "", v); print v "\t" $0 }' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | cut -f2 \
            | grep -B1 -xF "$TAG" | grep -vxF "$TAG" || true)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "previous release: ${prev:-none}"

      # As in release-hurad.yml: one directory, verified downloads.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -eu
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      # `--latest=false`: GitHub's "latest" is hurad's, and the release page
      # and the hurad links on gethura.app lead with it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -eu
          set -- dist/*.msi dist/*.exe dist/*.dmg dist/SHA256SUMS
          # `latest.json` is written only when there is an updater key; without
          # one this is a release without self-update, not a failed release.
          [ -f dist/latest.json ] && set -- "$@" dist/latest.json
          notes_from=""
          [ -n "$PREV" ] && notes_from="--notes-start-tag=$PREV"
          gh release create "$TAG" --verify-tag --latest=false \
            --title "hura desktop $VERSION" --generate-notes $notes_from "$@"

      # Windows installed before the split read
      # `/releases/latest/download/latest.json`, which is now the newest hurad
      # release. Putting this manifest there too keeps them updating, and the
      # first update they take moves them to the address below.
      - name: Refresh the manifest on the latest release
        if: hashFiles('dist/latest.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(gh release view --json tagName --jq .tagName)
          case "$latest" in
            hurad-v*) gh release upload "$latest" dist/latest.json --clobber
                      echo "refreshed latest.json on $latest" ;;
            *) echo "the latest release is $latest, not a hurad one; leaving it" ;;
          esac

  # The address the installed app reads, gethura.app/desktop/latest.json, is
  # the site, and the site is `site/` on `main`. So the manifest is committed
  # there, after the release it points into exists: a manifest that went up
  # first would offer an installer that is not downloadable yet.
  #
  # With the release deploy key, for the reason `tag.yml` gives: `main` requires
  # CI checks that a bot's commit has never had, and a deploy key can bypass
  # that where `GITHUB_TOKEN` cannot.
  manifest:
    name: Point the updater at this release
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: hura-desktop-windows
          path: dist

      - name: Commit site/desktop/latest.json
        run: |
          set -eu
          if [ ! -f dist/latest.json ]; then
            echo "no update manifest (no updater key); nothing to point at"
            exit 0
          fi
          mkdir -p site/desktop
          cp dist/latest.json site/desktop/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/desktop/latest.json
          git commit -m "Point the desktop updater at $TAG"
          # `main` may have moved while the builds ran; rebasing one file on top
          # of whatever landed is safe, and three tries is plenty.
          for attempt in 1 2 3; do
            git push origin HEAD:refs/heads/main && exit 0
            git pull --rebase --quiet origin main
          done
          echo "::error::could not push site/desktop/latest.json"
          exit 1
