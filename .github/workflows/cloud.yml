name: hura cloud image

# hura-cloud, built from main and published to ghcr.io/<owner>/hura-cloud as
# `latest` and as the commit it was built from. Coolify pulls `latest`; a
# commit's tag is what to go back to. See docs/cloud.md.
#
# amd64 only, which is what the server runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crates/hura-cloud/**
      - Cargo.lock
      - .github/workflows/cloud.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image
  cancel-in-progress: false

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The source label is what links the package on ghcr.io to this
      # repository.
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hura-cloud"
          docker build -f crates/hura-cloud/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:latest" -t "$image:$GITHUB_SHA" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
